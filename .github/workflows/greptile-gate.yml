# Merge gate: passes only when Greptile's latest Confidence Score on the PR is 5/5.
# Publishes a commit status "greptile-confidence" on the PR head SHA; branch protection on main requires it.
name: Greptile confidence gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to evaluate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: greptile-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(
              context.payload.pull_request?.number ??
              context.payload.issue?.number ??
              context.payload.inputs?.pr_number,
            );
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const isGreptile = (u) => /greptile/i.test(u?.login || "");
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 });
            const bodies = [
              ...comments.filter((c) => isGreptile(c.user)).map((c) => ({ at: c.updated_at, body: c.body || "" })),
              ...reviews.filter((r) => isGreptile(r.user)).map((r) => ({ at: r.submitted_at, body: r.body || "" })),
            ].sort((a, b) => new Date(b.at) - new Date(a.at));
            let score = null;
            for (const { body } of bodies) {
              const m = body.match(/confidence\s*score[^0-9]{0,20}([0-5])\s*\/\s*5/i);
              if (m) { score = Number(m[1]); break; }
            }
            const state = score === 5 ? "success" : score === null ? "pending" : "failure";
            const description = score === null ? "Waiting for a Greptile confidence score" : `Greptile confidence ${score}/5 (needs 5/5)`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, state, context: "greptile-confidence", description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            core.info(`${description} -> ${state}`);
